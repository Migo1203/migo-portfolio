<style>

<header class="review">
 <strong>Migo｜低保真线框 V01 · 待审阅</strong>
 <p>只验收信息顺序、内容范围和操作路径。灰度、系统字体、图片框均为线框占位；英文为结构试读草稿。</p>
 <div class="controls">
  <label>页面 <select id="page-select"><option value="ned">01 NED 项目详情</option><option value="home">02 首页</option><option value="work">03 作品列表</option><option value="about">04 关于</option><option value="contact">05 联系</option><option value="404">06 404</option></select></label>
  <label>视图 <select id="device-select"><option value="desktop">桌面 · 1440px</option><option value="mobile">手机 · 390px</option></select></label>
  <label>内容 <select id="lang-select"><option value="zh">中文草稿</option><option value="en">English draft</option></select></label>
  <button id="fit" type="button">适应窗口</button><button id="actual" type="button">原始尺寸</button>
 </div>
</header>
<div class="surface"><article id="wireframe" class="canvas"></article></div>
<aside class="review-note"><p id="page-note"></p><p>审阅重点：NED 分工是否容易理解；完整成果能否找到；手机阅读与页面返回是否清楚。联系方式、完整译文、素材公开条件和品牌视觉仍待确认。</p><p>这是本地线框原型，无真实表单、托管路由或正式网站实现。<a href="README.md">查看交付与验收说明</a> · <a href="../../文档/首篇案例资料卡.md">查看案例来源与版本</a></p></aside>
<dialog id="lightbox" aria-labelledby="lightbox-title"><div class="dialog-top"><h2 id="lightbox-title"></h2><button id="close-modal" type="button" aria-label="关闭 / Close">关闭 ×</button></div><p id="lightbox-count" class="muted"></p><div class="placeholder large-slot"><strong id="lightbox-label"></strong><small>大图占位 · 实际作品素材后续接入<br>Image placeholder · original artwork to be integrated</small></div><div class="modal-actions"><button id="prev-image" type="button">← 上一张 / Previous</button><button id="next-image" type="button">下一张 / Next →</button></div></dialog>
<script>
const params=new URLSearchParams(location.search);
const pages=['ned','home','work','about','contact','404'];
const page=pages.includes(params.get('page'))?params.get('page'):'ned';
const device=params.get('device')==='mobile'?'mobile':'desktop';
const lang=params.get('lang')==='en'?'en':'zh';
const mode=params.get('mode')==='canvas'?'canvas':'review';
const en=lang==='en';const T=(zh,eng)=>en?eng:zh;
document.documentElement.lang=en?'en':'zh-CN';
document.body.classList.toggle('canvas-mode',mode==='canvas');
const canvas=document.querySelector('#wireframe');canvas.classList.toggle('mobile',device==='mobile');
function url(p=page,l=lang){return '?'+new URLSearchParams({page:p,device,lang:l,mode}).toString()}
function link(p,label,cls=''){return `<a class="${cls}" href="${url(p)}" ${p===page?'aria-current="page"':''}>${label}</a>`}
const labels={home:T('首页','Home'),work:T('作品','Work'),ned:T('NED 项目详情','NED project'),about:T('关于','About'),contact:T('联系','Contact'),'404':'404'};
const nav=()=>['work','about','contact'].map(p=>link(p,labels[p])).join('')+`<a class="language" href="${url(page,en?'zh':'en')}" lang="${en?'zh-CN':'en'}">${en?'中文':'EN'}</a>`;
const header=()=>`<a class="skip" href="#main">${T('跳到正文','Skip to content')}</a><header class="site-header"><a class="wordmark" href="${url('home')}">Migo<span>${T('临时文字标识','Temporary text mark')}</span></a><nav class="site-nav" aria-label="${T('主导航','Main navigation')}">${nav()}</nav><details class="mobile-menu"><summary>${T('菜单 / 语言','Menu / Language')}</summary><nav aria-label="${T('手机导航','Mobile navigation')}">${nav()}</nav></details></header>${en?'<div class="lang-warning">English content is a wireframe draft and has not been approved for publication.</div>':''}`;
const footer=()=>`<footer class="site-footer"><span>Migo · ${T('独立视觉设计师','Independent visual designer')}</span><div class="row">${link('work',T('返回作品','View work'))}${link('about',T('了解我','About me'))}${link('contact',T('联系','Contact'))}</div></footer>`;
const btn=(p,label)=>link(p,label,'action');
const imageGroups={};
function gallery(group,items,cols=''){
 imageGroups[group]=items;
 return `<div class="gallery ${cols}" data-gallery="${group}">${items.map((item,i)=>`<button class="placeholder ${item.wide?'wide':''}" type="button" data-group="${group}" data-image="${i}" aria-label="${T('放大：','Enlarge: ')}${item.label}"><strong>${item.label}</strong><small>${item.note||T('原图占位 · 点击放大','Original image slot · click to enlarge')}</small></button>`).join('')}</div>`;
}
const slot=(label,more='',cls='hero-slot')=>`<div class="placeholder ${cls}"><strong>${label}</strong><small>${more||T('作品素材占位','Artwork placeholder')}</small></div>`;
const section=(id,num,title,body)=>`<section class="section" id="${id}"><p class="eyebrow">${num}</p><h2>${title}</h2>${body}</section>`;
const casecard=()=>`<div class="grid2"><a href="${url('ned')}" aria-label="${T('查看 NED 案例','View the NED case')}">${slot('NED Eric Lamp',T('封面 V04 · 待审阅','Cover V04 · pending review'))}</a><div><p class="eyebrow">${T('当前网站试验案例','Current website trial case')}</p><h2>NED Eric Lamp</h2><p>${T('以商品识别、功能说明和生活方式表达，组织一套电商视觉内容。','An e-commerce visual concept connecting product recognition, functional information and everyday settings.')}</p><p class="muted">${T('自发模拟项目 · AI 协作 · 无真实上架或投放','Self-initiated simulation · AI collaboration · not launched or advertised')}</p>${btn('ned',T('查看项目 →','View project →'))}</div></div>`;
function ned(){
 const goods=[T('主图 V01','Main image V01'),T('01 产品场景 V02','01 Product setting V02'),T('02 旋钮操作 V02','02 Knob controls V02'),T('03 光色调节 V01','03 Color temperature V01'),T('04 续航场景 V02','04 Runtime setting V02'),T('05 尺寸材质 V02','05 Size and material V02'),T('06 户外场景 V02','06 Outdoor setting V02'),T('07 多场景 V02','07 Multiple settings V02')];
 const states=[T('居家开场','Home opening'),T('细节：顶部旋钮','Detail: top knob'),T('细节：沙色表面','Detail: sand finish'),T('操作：按压开关','Control: press'),T('操作：旋转调光','Control: turn'),T('操作：按旋调色','Control: press and turn'),T('场景：餐桌','Setting: dining'),T('场景：床头','Setting: bedside'),T('场景：露台','Setting: terrace'),T('尺寸','Dimensions'),T('使用问答','FAQ')];
 const desktop=[T('居家开场','Home opening'),T('整体与真实细节','Product and real details'),...states.slice(3)];
 const stories=[T('品牌介绍','Brand introduction'),T('审美与造型','Form and character'),T('日常生活','Everyday moments'),T('品牌问答','Brand FAQ')];
 const banners=[T('店铺页头','Store header'),T('餐桌导流 · 电脑','Dining banner · desktop'),T('餐桌导流 · 手机','Dining banner · mobile'),T('REC 广告 · 横','REC ad · landscape'),T('REC 广告 · 方','REC ad · square'),T('REC 广告 · 竖','REC ad · portrait')];
 const toc=[['overview',T('概述','Overview')],['role',T('我的工作','My contribution')],['decisions',T('设计判断','Design decisions')],['goods',T('商品图','Product images')],['aplus',T('高级 A+','Premium A+')],['story',T('品牌故事','Brand story')],['banners',T('Banner','Banners')],['reflection',T('复盘','Reflection')]];
 let out=`<div class="container"><main id="main"><section class="hero"><p class="eyebrow">${link('work',T('作品','Work'))} / NED Eric Lamp</p><h1>NED Eric Lamp</h1><p class="lead">${T('让氛围被感受，让产品被看懂。','Helping people feel the atmosphere and understand the product.')}</p><p>${T('自发电商视觉模拟 · 当前网站试验案例','Self-initiated e-commerce simulation · current website trial case')}</p><dl class="meta"><div><dt>${T('展示语境','Context')}</dt><dd>${T('亚马逊美国站概念','Amazon US concept')}</dd></div><div><dt>${T('我的工作','My contribution')}</dt><dd>${T('目标、方向、取舍与审稿','Goals, direction, selection and review')}</dd></div><div><dt>${T('成果范围','Scope')}</dt><dd>${T('商品图 / Listing / A+ / 品牌故事 / Banner','Product images / Listing / A+ / Brand story / Banners')}</dd></div></dl>${gallery('cover',[{label:T('项目封面 · 开篇 V04','Project cover · V04'),note:'1600 × 1200 · '+T('待审阅','pending review'),wide:true}],'two')}<nav class="toc" aria-label="${T('案例章节','Case chapters')}">${toc.map(([id,label])=>`<a href="#${id}">${label}</a>`).join('')}</nav></section>`;
 out+=section('overview','01 / OVERVIEW',T('项目概述','Project overview'),`<p>${T('围绕 NED Eric 台灯的真实产品资料，探索面向亚马逊美国站的电商视觉：在商品识别、操作说明与生活方式表达之间建立一致的内容体验。','A self-initiated exploration based on available information about the NED Eric lamp, connecting product recognition, controls and lifestyle storytelling in an Amazon US context.')}</p><p class="inline-note">${T('这是作品集模拟项目，非 NED 品牌委托。未实际上架或投放；产品参数为来源资料标称，未实测。','This is a portfolio simulation, not a NED commission. It has not been launched or advertised. Product specifications are source claims, not independently tested results.')}</p>`);
 out+=section('role','02 / CONTRIBUTION',T('我的工作与 AI 协作','My contribution and AI collaboration'),`<div class="grid2"><div class="panel"><h3>Migo</h3><ul class="role-list"><li>${T('提出项目目标与审美方向','Defined project goals and aesthetic direction')}</li><li>${T('选择参考与比较版本','Selected references and compared versions')}</li><li>${T('作出取舍，提供审稿与迭代反馈','Made selections and provided review feedback')}</li></ul></div><div class="panel"><h3>Codex + AI</h3><ul class="role-list"><li>${T('资料整理、图像生成与合成','Research organization, image generation and compositing')}</li><li>${T('英文文案、SVG 排版与导出','English copy, SVG layout and exports')}</li><li>${T('执行范围以原制作记录为依据','Execution scope follows the production records')}</li></ul></div></div>`);
 out+=section('decisions','03 / DECISIONS',T('设计判断：从问题到内容','Design decisions: from questions to content'),`<div class="grid3"><div class="panel"><h3>${T('01 统一气质，保留昼夜差异','01 Consistency with day–night variation')}</h3><p>${T('暖中性与自然材质作为共同基础，用日间、夜间和暮色区分场景职责。','A warm neutral base and natural materials connect daylight, night and dusk settings with distinct roles.')}</p></div><div class="panel"><h3>${T('02 产品优先，按问题分组','02 Product first, organized by question')}</h3><p>${T('商品图帮助识别与理解卖点，A+ 展开细节和体验，Banner 承担不同入口的表达。','Product images explain recognition and features; A+ expands details and experience; banners serve distinct entry points.')}</p></div><div class="panel"><h3>${T('03 检查保真与状态覆盖','03 Fidelity and state coverage')}</h3><p>${T('根据反馈修订产品边缘、近景与场景差异，并补齐手机端内容状态。','Feedback informed revisions to product edges, close-ups and scene variation, plus complete mobile content coverage.')}</p></div></div>${gallery('strategy',[{label:T('背景与视觉策略 · V04','Background and visual strategy · V04'),note:T('现有策略页占位，项目参考色不是 Migo 品牌色','Existing strategy board slot; its reference colors are not Migo brand colors'),wide:true}],'two')}`);
 out+=section('goods','04A / OUTPUT',T('商品图与 Listing','Product images and Listing'),`<p>${T('完整保留 1 张主图、7 张辅图与 Listing V01。Listing 是模拟页面，文字后续需提供网页可读版本。','Retains one main image, seven supporting images and Listing V01. The Listing is a simulation; a readable text version is to be provided.')}</p>${gallery('listing',[{label:'Listing V01',note:T('完整模拟页面 · 可放大','Full simulated page · enlarge to inspect'),wide:true}],'two')}${gallery('goods',goods.map(label=>({label})))}`);
 out+=section('aplus','04B / OUTPUT',T('高级 A+：细节、操作与场景','Premium A+: details, controls and settings'),`<p>${T('内容源 V03；外层展示 V04 · 修订 V02。桌面 10 个模块，手机 11 个图文状态，完整保留。','Content source V03; presentation V04, revision V02. All ten desktop modules and eleven mobile content states are retained.')}</p><h3>${T('桌面完整内容 · 10 模块','Complete desktop content · 10 modules')}</h3>${gallery('aplus-desktop',desktop.map(label=>({label,wide:true})),'two')}<h3 style="margin-top:32px">${T('手机完整内容 · 11 状态','Complete mobile content · 11 states')}</h3>${gallery('aplus-mobile',states.map(label=>({label})))}`);
 out+=section('story','04C / OUTPUT',T('品牌故事：从产品走向生活方式','Brand story: from product to everyday living'),`<p>${T('内容源品牌故事 V01，外层展示 V04。完整桌面卡组与四个手机状态保留。','Brand story V01 within presentation V04. The full desktop card set and all four mobile states are retained.')}</p>${gallery('story-desktop',[{label:T('品牌氛围开场','Brand atmosphere opening'),wide:true},{label:T('桌面完整卡组','Complete desktop card set'),wide:true}],'two')}${gallery('story-mobile',stories.map(label=>({label})))}`);
 out+=section('banners','04D / OUTPUT',T('Banner 系统：不同入口','Banner system: distinct entry points'),`<p>${T('三主题、六份适配，内容源 Banner V02；完整保留电脑、手机及广告比例。','Three themes and six adaptations from Banner V02, retaining desktop, mobile and ad formats.')}</p>${gallery('banners',banners.map(label=>({label,wide:true})),'two')}`);
 out+=section('reflection','05 / REFLECTION',T('简短复盘','Brief reflection'),`<div class="grid2"><div><h3>${T('把检查提前到扩展整套之前','Check before scaling up')}</h3><p>${T('现有记录显示，产品边缘、构图差异和手机状态覆盖曾引发返工。下一次应先验证关键试样，再扩展整套。','The records identify rework around product edges, composition variation and mobile state coverage. Key samples should be checked before expanding a full set.')}</p></div><div><h3>${T('结果与限制','Results and limitations')}</h3><p>${T('形成了可追溯的视觉内容与版本记录。没有真实销售或转化数据，不能据此证明商业效果。','The project produced traceable visual content and version records. Without sales or conversion data, commercial impact cannot be established.')}</p></div></div>`);
 out+=section('next','06 / NEXT',T('继续了解 Migo','Continue exploring'),`<div class="actions">${btn('work',T('返回作品列表','Back to work'))}${btn('about',T('关于 Migo','About Migo'))}${btn('contact',T('联系','Contact'))}</div><p class="caption">${T('其他案例尚未选定，暂不设置虚构的“下一个项目”。','Other cases have not been selected; no fictional next project is included.')}</p>`);
 return out+'</main></div>';
}

function work(){return `<div class="container"><main id="main"><section class="hero"><p class="eyebrow">WORK</p><h1>${T('作品与案例','Work and case studies')}</h1><p class="lead">${T('从项目目标、设计判断与具体成果，了解我的工作。','Explore project goals, design decisions and outcomes.')}</p></section>${section('cases','01 / CASE STUDIES',T('当前试验案例','Current trial case'),casecard())}<section class="section"><h2>${T('后续案例','Future cases')}</h2><p>${T('Migo × Beedog 个人品牌 IP 设计原计划作为首篇案例，目前尚未完成。完成并审阅后再决定上线顺序。','The Migo × Beedog personal brand and character project was originally intended as the first case. It remains in development; publication order will be decided after review.')}</p><p class="muted">${T('当前仅有一个试验案例，不设置无效筛选或虚构作品卡片。','Only one trial case is included; no non-functional filters or invented projects are added.')}</p></section></main></div>`}
function about(){return `<div class="container"><main id="main"><section class="hero"><p class="eyebrow">ABOUT</p><h1>${T('我是 Migo','I’m Migo')}</h1><p class="lead">${T('独立视觉设计师，关注商业视觉、AI 辅助创作与创意思考。','An independent visual designer interested in commercial visuals, AI-assisted creation and creative thinking.')}</p><p>${T('好奇探索，认真设计。','Explore with curiosity. Design with care.')}</p></section>${section('practice','01 / PRACTICE',T('通过实际项目了解我的工作','Understand my work through real project records'),`<p>${T('在 NED 试验案例中，我负责项目目标、审美方向、参考选择、版本取舍与审稿反馈，并与 Codex 和 AI 工具协作。','In the NED trial case, I set goals and aesthetic direction, selected references, compared versions and provided review feedback in collaboration with Codex and AI tools.')}</p>${btn('ned',T('查看 NED 案例','View the NED case'))}<div class="empty">${T('个人经历、具体求职岗位与履历资料待补充。','Experience, target role and résumé details are to be provided.')}</div>`)}${section('brand','02 / MIGO × BEEDOG',T('设计师与品牌角色','Designer and brand character'),`<div class="grid2"><div><h3>Migo</h3><p>${T('设计师与品牌主体，负责专业创作、设计决策和商业服务。','The designer and brand owner, responsible for professional creation, design decisions and commercial services.')}</p><h3>Beedog</h3><p>${T('Migo 的原创品牌角色，支持情感表达与内容互动；不是另一位独立设计师。','Migo’s original brand character for emotional expression and content interaction, not a separate designer.')}</p></div>${slot(T('Beedog 已确认形象位置','Slot for an approved Beedog visual'),T('角色设计 Pending · 本轮不绘制','Character design pending · no character artwork created'))}</div>`)}${section('next','03 / NEXT',T('查看作品或进一步交流','Explore work or get in touch'),`<div class="actions">${btn('work',T('查看作品','View work'))}${btn('contact',T('联系','Contact'))}</div>`)}</main></div>`}
function contact(){return `<div class="container"><main id="main"><section class="hero"><p class="eyebrow">CONTACT</p><h1>${T('一起讨论下一步','Let’s discuss what’s next')}</h1><p class="lead">${T('求职机会优先，也欢迎商业合作交流。','Open to role opportunities and commercial collaborations.')}</p></section>${section('channels','01 / GET IN TOUCH',T('联系入口','Contact channels'),`<div class="grid2"><div class="panel"><h3>${T('联系渠道','Contact method')}</h3><p>${T('邮箱或其他主要联系方式待提供。','An email address or primary contact method is to be provided.')}</p><button type="button" disabled>${T('联系方式待补充','Contact details pending')}</button><p class="caption">${T('渠道确认后再开放实际联系操作。','Contact actions will become available once details are confirmed.')}</p></div><div class="panel"><h3>${T('交流时可附上','Helpful context')}</h3><ul class="role-list"><li>${T('岗位或项目背景','Role or project context')}</li><li>${T('需要的设计内容与时间安排','Design scope and timing')}</li><li>${T('便于回复的联系信息','Contact details for a reply')}</li></ul></div></div><p class="inline-note">${T('当前没有在线表单或消息收集。','No contact form or message collection is currently provided.')}</p>`)}${section('next','02 / EXPLORE',T('先了解我的工作','Explore my work first'),`<div class="actions">${btn('work',T('查看作品','View work'))}${btn('about',T('关于 Migo','About Migo'))}</div>`)}</main></div>`}
function notfound(){return `<div class="container"><main class="page404" id="main"><p class="eyebrow">PAGE NOT FOUND</p><h1>404</h1><h2>${T('这个页面暂时找不到','This page could not be found')}</h2><p>${T('链接可能已变更，你可以回到首页或继续查看作品。','The link may have changed. Return home or continue exploring the work.')}</p><div class="actions">${btn('home',T('返回首页','Return home'))}${btn('work',T('查看作品','View work'))}</div></main></div>`}
const render={ned,home,work,about,contact,'404':notfound};
canvas.innerHTML=header()+render[page]()+footer();
document.title=`${labels[page]}｜${device==='mobile'?'手机':'桌面'}｜Migo 线框 V01`;
const notes={ned:'NED：摘要与分工在成果之前；章节导航可跳转；全部图位均可放大，并按所属图组前后切换。',home:'首页：以真实身份与作品入口为主，NED 仅为当前试验案例。',work:'作品列表：当前只放 NED，一张有效卡片；品牌 IP 未完成，不设成品详情入口。',about:'关于：真实分工与 Migo／Beedog 身份分开表达；不编造履历或手工制作经验。',contact:'联系：待提供真实渠道；禁用占位按钮，不伪造邮箱或提交成功。','404':'404：可返回首页或作品，保留语言切换；实际托管路由尚未实施。'};
document.querySelector('#page-note').textContent=notes[page];
for(const [id,value] of [['page-select',page],['device-select',device],['lang-select',lang]])document.getElementById(id).value=value;
for(const id of ['page-select','device-select','lang-select'])document.getElementById(id).addEventListener('change',()=>{location.search=new URLSearchParams({page:document.getElementById('page-select').value,device:document.getElementById('device-select').value,lang:document.getElementById('lang-select').value}).toString()});
let fit=true;function resize(){canvas.style.zoom=mode==='canvas'||!fit?'1':Math.min(1,(innerWidth-48)/(device==='mobile'?390:1440))}
document.getElementById('fit').onclick=()=>{fit=true;resize()};document.getElementById('actual').onclick=()=>{fit=false;resize()};addEventListener('resize',resize);resize();
const dialog=document.getElementById('lightbox');let group='',index=0,opener=null;
function displayImage(){const items=imageGroups[group];document.getElementById('lightbox-title').textContent=items[index].label;document.getElementById('lightbox-label').textContent=items[index].label;document.getElementById('lightbox-count').textContent=`${index+1} / ${items.length}`;document.getElementById('prev-image').disabled=index===0;document.getElementById('next-image').disabled=index===items.length-1;}
document.querySelectorAll('[data-image]').forEach(el=>el.addEventListener('click',()=>{opener=el;group=el.dataset.group;index=Number(el.dataset.image);displayImage();dialog.showModal()}));
document.getElementById('close-modal').onclick=()=>dialog.close();dialog.addEventListener('close',()=>opener?.focus());
document.getElementById('prev-image').onclick=()=>{if(index>0){index--;displayImage()}};document.getElementById('next-image').onclick=()=>{if(index<imageGroups[group].length-1){index++;displayImage()}};
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&index>0){index--;displayImage()}if(e.key==='ArrowRight'&&index<imageGroups[group].length-1){index++;displayImage()}});
window.wireframeState={page,device,lang,mode,groupCounts:Object.fromEntries(Object.entries(imageGroups).map(([k,v])=>[k,v.length]))};
</script>
